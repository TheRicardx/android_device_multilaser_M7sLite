name: Compilar TWRP Multilaser A50

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Configurar Ambiente Linux
      uses: actions/checkout@v4

    - name: Clonar Construtor de Recovery Estável
      uses: actions/checkout@v4
      with:
        repository: 'SebaUbuntu/TWRP-device-tree-generator'
        path: 'twrp_builder'

    - name: Baixar Dependências do AOSP
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Inicializar Minimal Manifest e Compilar
      run: |
        mkdir workspace && cd workspace
        curl https://googleapis.com > repo
        chmod a+x repo
        ./repo init --depth=1 -u https://github.com -b twrp-9.0
        ./repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags
        git clone https://github.com device/multilaser/ML-SO06-M7sLite
        source build/envsetup.sh
        lunch omni_ML-SO06-M7sLite-eng
        mka bootimage ALLOW_MISSING_DEPENDENCIES=true
        cp out/target/product/ML-SO06-M7sLite/boot.img ../TWRP_Multilaser_A50.img

    - name: Upload do arquivo TWRP Finalizado
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Multilaser_A50_Image
        path: TWRP_Multilaser_A50.img

